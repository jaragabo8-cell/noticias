<section>
    <h2>Contacto</h2>

    <form>
        <p>
            <label>Nombre:</label><br>
            <input type="text" name="nombre">
        </p>

        <p>
            <label>Correo:</label><br>
            <input type="email" name="correo">
        </p>

        <p>
            <label>Mensaje:</label><br>
            <textarea name="mensaje" rows="6" cols="40"></textarea>
        </p>

        <p>
            <button type="submit">Enviar</button>
        </p>
    </form>
</section>
